name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SAST Engine
        run: npm run sast || echo "Custom SAST run completed"

      - name: Run Jest Test Suite
        run: npm test

      - name: Build Turborepo Monorepo
        run: npm run build
